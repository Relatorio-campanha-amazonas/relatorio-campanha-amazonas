(function(){
  const layer=document.querySelector('.mobile-nav-viewport');
  if(!layer) return;
  const mq=window.matchMedia('(max-width: 760px)');

  function syncMobileViewport(){
    if(!mq.matches){
      layer.style.removeProperty('height');
      layer.style.removeProperty('top');
      return;
    }
    const vv=window.visualViewport;
    const h=vv && vv.height ? vv.height : window.innerHeight;
    const top=vv && Number.isFinite(vv.offsetTop) ? vv.offsetTop : 0;
    /* A camada acompanha somente a área realmente visível do navegador. */
    layer.style.height=Math.max(1,h)+'px';
    layer.style.top=Math.max(0,top)+'px';
  }

  syncMobileViewport();
  requestAnimationFrame(syncMobileViewport);
  setTimeout(syncMobileViewport,60);
  setTimeout(syncMobileViewport,250);
  setTimeout(syncMobileViewport,700);
  window.addEventListener('pageshow',syncMobileViewport,{passive:true});
  window.addEventListener('resize',syncMobileViewport,{passive:true});
  window.addEventListener('orientationchange',syncMobileViewport,{passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',syncMobileViewport,{passive:true});
    window.visualViewport.addEventListener('scroll',syncMobileViewport,{passive:true});
  }
})();
